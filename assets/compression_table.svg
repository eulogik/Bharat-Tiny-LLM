<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="800" height="500" fill="#0f172a" rx="16"/>
  <text x="400" y="42" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Hindi Token Compression — Brahmi Injection</text>
  
  <!-- Table header -->
  <rect x="40" y="70" width="720" height="40" fill="#1e293b" rx="6"/>
  <text x="220" y="96" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Hindi Text</text>
  <text x="440" y="96" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Base Qwen Tokens</text>
  <text x="560" y="96" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Brahmi Tokens</text>
  <text x="680" y="96" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Savings</text>
  
  <!-- Row 1 -->
  <rect x="40" y="110" width="720" height="44" fill="#0f172a" rx="4"/>
  <text x="220" y="138" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Devanagari, sans-serif">नमस्ते, आप कैसे हैं?</text>
  <text x="440" y="138" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">15</text>
  <text x="560" y="138" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">7</text>
  <text x="680" y="138" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">−53%</text>
  
  <!-- Row 2 -->
  <rect x="40" y="154" width="720" height="44" fill="#1e293b" rx="4"/>
  <text x="220" y="182" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Devanagari, sans-serif">ज़रूरी बात है क्या करते हो</text>
  <text x="440" y="182" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">26</text>
  <text x="560" y="182" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">11</text>
  <text x="680" y="182" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">−58%</text>
  
  <!-- Row 3 -->
  <rect x="40" y="198" width="720" height="44" fill="#0f172a" rx="4"/>
  <text x="220" y="226" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Devanagari, sans-serif">हम आपको बताना चाहते हैं</text>
  <text x="440" y="226" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">18</text>
  <text x="560" y="226" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">8</text>
  <text x="680" y="226" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">−56%</text>
  
  <!-- Row 4 -->
  <rect x="40" y="242" width="720" height="44" fill="#1e293b" rx="4"/>
  <text x="220" y="270" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Devanagari, sans-serif">कितने बजे मिलना है?</text>
  <text x="440" y="270" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">12</text>
  <text x="560" y="270" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">5</text>
  <text x="680" y="270" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">−58%</text>
  
  <!-- Row 5 -->
  <rect x="40" y="286" width="720" height="44" fill="#0f172a" rx="4"/>
  <text x="220" y="314" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Devanagari, sans-serif">चाय पी लो, फिर बात करते हैं</text>
  <text x="440" y="314" text-anchor="middle" fill="#f87171" font-size="15" font-weight="600">20</text>
  <text x="560" y="314" text-anchor="middle" fill="#34d399" font-size="15" font-weight="600">9</text>
  <text x="680" y="314" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="600">−55%</text>
  
  <!-- Summary row -->
  <rect x="40" y="340" width="720" height="50" fill="#312e81" rx="6"/>
  <text x="220" y="370" text-anchor="middle" fill="#c7d2fe" font-size="16" font-weight="700">Average (1000 chars)</text>
  <text x="440" y="370" text-anchor="middle" fill="#f87171" font-size="18" font-weight="700">950</text>
  <text x="560" y="370" text-anchor="middle" fill="#34d399" font-size="18" font-weight="700">630</text>
  <text x="680" y="370" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">−33.8%</text>
  
  <!-- Footer -->
  <text x="400" y="430" text-anchor="middle" fill="#64748b" font-size="12">300 injected Devanagari tokens · Tokenizer: 151,936 → 152,236 · Apache 2.0</text>
  <text x="400" y="458" text-anchor="middle" fill="#64748b" font-size="12">Built by eulogik · huggingface.co/eulogik/Bharat-Tiny-LLM-v2-MLX</text>
  
  <!-- Badge -->
  <rect x="300" y="475" width="200" height="20" fill="#f59e0b" rx="10"/>
  <text x="400" y="489" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Open Source · Apache 2.0</text>
